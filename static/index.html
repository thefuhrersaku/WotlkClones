<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WOTLK Clones</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="panel header">
      <div class="title">❖&nbsp;&nbsp;WOTLK Clones&nbsp;&nbsp;❖</div>
      <div class="subtitle" data-i18n="app.subtitle"></div>
      <div class="lang-selector">
        <button class="lang-btn" data-lang="es" title="Español"><span class="flag ar"></span></button>
        <button class="lang-btn" data-lang="en" title="English"><span class="flag us"></span></button>
        <button class="lang-btn" data-lang="ru" title="Русский"><span class="flag ru"></span></button>
      </div>
    </header>

    <div class="panel wtf-bar">
      <input id="wtfField" type="text" placeholder="Carpeta WTF" data-i18n-placeholder="wtf.placeholder" spellcheck="false" />
      <button id="browseBtn" class="btn outline" data-i18n="wtf.browse">Buscar...</button>
      <button id="loadBtn" class="btn" data-i18n="wtf.load">Cargar</button>
      <label class="check" id="hideEmptyCharsLabel">
        <input type="checkbox" id="hideEmptyChars" />
        <span class="name" data-i18n="wtf.hideEmptyChars"></span>
      </label>
      <div class="spacer"></div>
      <button id="backupsBtn" class="btn outline">❖ <span data-i18n="wtf.backups">Backups</span></button>
      <button id="historyBtn" class="btn outline">❖ <span data-i18n="wtf.history">Historial</span></button>
    </div>

    <div id="mainTabs"></div>
  </div>

  <div class="modal-overlay hidden" id="confirmOverlay">
    <div class="modal">
      <div class="modal-title" data-i18n="confirm.title">Confirmar</div>
      <div class="modal-text" id="confirmText"></div>
      <div class="modal-actions">
        <button id="confirmNo" class="btn outline" data-i18n="confirm.cancel">Cancelar</button>
        <button id="confirmYes" class="btn" data-i18n="confirm.ok">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="progressOverlay">
    <div class="modal progress-modal">
      <div class="modal-title" id="progressTitle">Aplicando...</div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">Preparando...</div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="successOverlay">
    <div class="modal">
      <div class="modal-title" data-i18n="success.title">Aplicada</div>
      <div class="modal-text" id="successText"></div>
      <div class="modal-actions">
        <button id="successOk" class="btn" data-i18n="success.ok">Ok</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="historyOverlay">
    <div class="modal wide">
      <div class="modal-title">❖&nbsp;&nbsp;<span data-i18n="history.title">Historial</span>&nbsp;&nbsp;❖</div>
      <div class="log-box" id="logView"></div>
      <div class="modal-actions">
        <button id="historyClose" class="btn outline" data-i18n="history.close">Cerrar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="backupsOverlay">
    <div class="modal wide">
      <div class="modal-title">❖&nbsp;&nbsp;<span data-i18n="backups.title">Backups</span>&nbsp;&nbsp;❖</div>
      <div class="note-text" data-i18n="backups.note"></div>
      <div class="row backups-bulk-row">
        <button id="backupsOpenFolder" class="btn outline small">📁 <span data-i18n="backups.openFolder">Abrir carpeta</span></button>
        <div class="spacer"></div>
        <button id="backupsSelectAll" class="btn outline small" data-i18n="scope.selectAll">Seleccionar todas</button>
        <button id="backupsSelectNone" class="btn outline small" data-i18n="scope.selectNone">Deseleccionar todas</button>
        <button id="backupsDeleteSelected" class="btn danger small" data-i18n="backups.deleteSelected">Eliminar seleccionados</button>
      </div>
      <div class="backup-list" id="backupsList"></div>
      <div class="modal-actions">
        <button id="backupsClose" class="btn outline" data-i18n="backups.close">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="snackbar" class="hidden"></div>

  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
