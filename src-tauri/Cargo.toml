[package]
name = "wotlk-clones"
version = "1.0.0"
description = "WOTLK Clones - Config Sync 3.3.5a"
authors = ["WOTLK Clones"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wotlk_clones_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
