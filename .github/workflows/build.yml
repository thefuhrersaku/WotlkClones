name: build-exe

on:
  workflow_dispatch:
  push:
    paths:
      - "src-tauri/**"
      - "static/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias del CLI
        run: npm ci

      - name: Compilar app + instalador NSIS
        run: npm run tauri -- build

      - name: Subir instalador como artifact
        uses: actions/upload-artifact@v4
        with:
          name: WotlkClones-Setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Subir exe suelto como artifact
        uses: actions/upload-artifact@v4
        with:
          name: WotlkClones-exe
          path: src-tauri/target/release/WotlkClones.exe
