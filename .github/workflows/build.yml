name: build-exe

on:
  workflow_dispatch:
  push:
    paths:
      - "WotlkClones.py"
      - "installer.iss"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de Python
        run: pip install flet flet-cli pyinstaller

      - name: Compilar exe (modo carpeta)
        run: >
          flet pack WotlkClones.py
          --onedir
          --name WotlkClones
          --icon icon.ico
          --product-name "WOTLK Clones"
          --file-description "WOTLK Clones - Config Sync"
          --company-name "WOTLK Clones"
          --copyright "WOTLK Clones"

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Compilar instalador
        run: iscc installer.iss

      - name: Subir instalador como artifact
        uses: actions/upload-artifact@v4
        with:
          name: WotlkClones-Setup
          path: installer_output/WotlkClones-Setup.exe

      - name: Subir carpeta suelta como artifact (opcional, sin instalar)
        uses: actions/upload-artifact@v4
        with:
          name: WotlkClones-carpeta
          path: dist/WotlkClones
