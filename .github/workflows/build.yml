name: build-exe

on:
  workflow_dispatch:
  push:
    paths:
      - "WotlkClones.py"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install flet flet-cli pyinstaller

      - name: Compilar exe
        run: >
          flet pack WotlkClones.py
          --name WotlkClones
          --icon icon.ico
          --product-name "WOTLK Clones"
          --file-description "WOTLK Clones - Config Sync"
          --company-name "WOTLK Clones"
          --copyright "WOTLK Clones"

      - name: Subir exe como artifact
        uses: actions/upload-artifact@v4
        with:
          name: WotlkClones-exe
          path: dist/WotlkClones.exe
